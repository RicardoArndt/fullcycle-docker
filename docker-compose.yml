services: 
    db:
        image: mysql:8
        container_name: db
        restart: always
        tty: true
        volumes:
            - db:/var/lib/mysql
        environment:
            - MYSQL_DATABASE=fullcycle
            - MYSQL_ROOT_PASSWORD=root
        expose: 
            - "3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
            interval: 5s
            timeout: 10s
            retries: 5
            start_period: 30s
        networks:
            - fullcycle

    node:
        build: 
            context: ./node
            target: builder
        working_dir: /app
        container_name: node-fullcycle
        volumes:
            - ./node:/app
            - /app/node_modules
        expose:
            - "3000"
        environment:
            - DB_HOST=db
            - DB_PORT=3306
            - DB_USER=root
            - DB_PASSWORD=root
            - DB_NAME=fullcycle
            - APP_PORT=3000
        depends_on:
            db:
                condition: service_healthy
        networks:
            - fullcycle
        command: ["npm", "run", "dev"]

    nginx:
        image: nginx:latest
        restart: always
        ports:
            - "8080:80"
        volumes:
            - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
        depends_on:
            - node
        networks:
            - fullcycle

networks:
    fullcycle:
        driver: bridge

volumes:
    db:
